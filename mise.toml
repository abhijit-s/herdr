[tools]
# Requires Zig 0.16.0 (vendored libghostty-vt's minimum_zig_version).
# Zig 0.15.x hit a known macOS Tahoe SDK linker bug (undefined libSystem
# symbols — ziglang/zig#31658, ghostty-org/ghostty#11991) that is fixed
# upstream in 0.16, so no Homebrew workaround is needed on this version.
zig = "0.16.0"
